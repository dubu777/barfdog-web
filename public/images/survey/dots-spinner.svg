<svg xmlns="http://www.w3.org/2000/svg"
    width="36" height="36" viewBox="0 0 24 24">
  <circle cx="4" cy="12" r="3" fill="#BE1A21">
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="0.75s"
      begin="0s"
      repeatCount="indefinite"
    />
  </circle>
  <circle cx="12" cy="12" r="3" fill="#BE1A21">
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="0.75s"
      begin="0.15s"
      repeatCount="indefinite"
    />
  </circle>
  <circle cx="20" cy="12" r="3" fill="#BE1A21">
    <animate
      attributeName="opacity"
      values="1;0.2;1"
      dur="0.75s"
      begin="0.3s"          
      repeatCount="indefinite"
    />
  </circle>
</svg>
