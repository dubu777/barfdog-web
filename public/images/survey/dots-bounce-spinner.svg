<svg xmlns="http://www.w3.org/2000/svg"
     width="36" height="36" viewBox="0 0 24 24">

  <!-- 첫 번째 점: 즉시 시작 -->
  <circle cx="4" cy="12" r="3" fill="#BE1A21">
    <animate
      attributeName="cy"
      values="12;6;12;12"
      keyTimes="0;0.3;0.6;1"
      dur="1s"
      begin="0s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines=".33,.66,.66,1;.33,0,.66,.33;.33,.66,.66,1"
    />
  </circle>

  <!-- 두 번째 점: 0.1초 딜레이 -->
  <circle cx="12" cy="12" r="3" fill="#BE1A21">
    <animate
      attributeName="cy"
      values="12;6;12;12"
      keyTimes="0;0.3;0.6;1"
      dur="1s"
      begin="0.1s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines=".33,.66,.66,1;.33,0,.66,.33;.33,.66,.66,1"
    />
  </circle>

  <!-- 세 번째 점: 0.2초 딜레이 -->
  <circle cx="20" cy="12" r="3" fill="#BE1A21">
    <animate
      attributeName="cy"
      values="12;6;12;12"
      keyTimes="0;0.3;0.6;1"
      dur="1s"
      begin="0.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines=".33,.66,.66,1;.33,0,.66,.33;.33,.66,.66,1"
    />
  </circle>

</svg>
